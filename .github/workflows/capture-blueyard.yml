name: Capture licensed BlueYard runtime
on:
  push:
    paths:
      - '.github/workflows/capture-blueyard.yml'
      - 'tools/capture-blueyard.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Capture live site, JS, assets and GLSL
        run: node tools/capture-blueyard.mjs --headless
      - name: Save captured original resources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blueyard-raw-runtime
          path: |
            blueyard-capture/
            blueyard-capture.tar.gz
          if-no-files-found: warn
          retention-days: 1
